# Legal Record Canonical Field Registry (v3.0)
# FIELD DATA ONLY
# Source: legal-record-acf-fields-v3.0.md
# Rules: ws-acf-field-guidance-v1.0.md (immutable global ruleset)
#
# This registry encodes the field definitions extracted from the markdown spec.
# It is NOT a ruleset — rules live in guidance. This is pure data.
# The compiler reads guidance (rules), this registry (field data), and taxonomies (register-taxonomies.php).

---

fields:
  # IDENTITY TAB
  jurisdiction:
    tab: Identity
    order: 10
    spec: "single-select taxonomy: ws_jurisdiction"
  
  official_name:
    tab: Identity
    order: 20
    spec: "text"
  
  common_name:
    tab: Identity
    order: 30
    spec: "text"
  
  citation:
    tab: Identity
    order: 40
    spec: "text"
  
  date:
    tab: Identity
    order: 50
    spec: "date_picker"
  
  has_effective_date:
    tab: Identity
    order: 60
    spec: "boolean; triggers effective_date"
  
  effective_date:
    tab: Identity
    order: 70
    spec: "date_picker; conditional on has_effective_date is true"
  
  effective_year:
    tab: Identity
    order: 80
    spec: "number; hook: butchers"
  
  retro_date:
    tab: Identity
    order: 90
    spec: "date_picker; Sister to retro_context; hook: required"
    legal_recognitions_trigger: retroactive-date
  
  retro_context:
    tab: Identity
    order: 100
    spec: "textarea; conditional on retroactive-date in legal_recognitions"
  
  protection_scope:
    tab: Identity
    order: 110
    spec: "select: disclosure|retaliation|both"
    notes: "Replaces former ws_protection_scope taxonomy"
  
  general_description:
    tab: Identity
    order: 120
    spec: "textarea; from ingest reconciler"
  
  has_attach_flag:
    tab: Identity
    order: 130
    spec: "boolean; special-case approved has_* bool; triggers display_order"
  
  display_order:
    tab: Identity
    order: 140
    spec: "number; conditional on has_attach_flag is true"
  
  last_reviewed_date:
    tab: Identity
    order: 999
    spec: "date_picker; must be last in Identity Tab"

  # CLASSIFICATION TAB
  legal_recognitions:
    tab: Classification
    order: 10
    spec: "taxonomy: ws_legal_recognition; multi-select; hook: impacts,excludes"
    notes: "Recognition taxonomy. Presence/absence signal. Triggers conditionals."
  
  manager_rule_exclusion_context:
    tab: Classification
    order: 20
    spec: "textarea; conditional on manager-rule-exclusion in legal_recognitions; hook: required"
  
  public_concern_required_context:
    tab: Classification
    order: 30
    spec: "textarea; conditional on public-concern-required in legal_recognitions AND public-sector in employment_sectors; hook: required"
  
  manner_of_opposition_context:
    tab: Classification
    order: 40
    spec: "textarea; conditional on manner-of-opposition-standard in legal_recognitions; hook: required"
  
  bad_faith_exclusion_context:
    tab: Classification
    order: 50
    spec: "textarea; conditional on bad-faith-exclusion in legal_recognitions; hook: required"
  
  anonymity_protection_context:
    tab: Classification
    order: 60
    spec: "textarea; conditional on anonymity-protection in legal_recognitions; hook: required"
  
  malicious_reporting_sanctions:
    tab: Classification
    order: 70
    spec: "repeater; Sister to malicious_reporting_context; subfields: conduct_sanctioned(select: knowingly-false|reckless-disregard|bad-faith-motive|see-context), sanction_penalty(select: civil-fine|remedy-forfeiture|attorney-fee-shift|felony|misdemeanor|see-context), conduct_context(textarea; conditional on conduct_sanctioned non-empty; hook: required)"
  
  malicious_reporting_context:
    tab: Classification
    order: 80
    spec: "textarea; conditional on malicious-reporting-sanctions in legal_recognitions"
  
  protected_action_standards:
    tab: Classification
    order: 90
    spec: "select: per-se-protected|actual-violation|reasonable-belief|good-faith; multi-select; Sister to protected_action_context"
  
  reasonable_belief_scope:
    tab: Classification
    order: 100
    spec: "select: objective-only|subjective-only|dual-prong|see-context; Sister to protected_action_context; conditional on protected_action_standards includes reasonable-belief"
  
  protected_action_sources:
    tab: Classification
    order: 110
    spec: "select: constitutional|statutory|judicial|regulatory|executive|see-context; multi-select; Sister to protected_action_context"
  
  protected_actions:
    tab: Classification
    order: 120
    spec: "taxonomy: ws_protected_action; multi-select; Sister to protected_action_context; hook: required"
  
  protected_action_context:
    tab: Classification
    order: 130
    spec: "textarea; conditional on protected-action in legal_recognitions"
  
  protected_disclosures:
    tab: Classification
    order: 140
    spec: "taxonomy: ws_protected_disclosure; multi-select"
  
  protected_classes:
    tab: Classification
    order: 150
    spec: "taxonomy: ws_protected_class; multi-select; hook: impacts,prerequisite,excludes"
  
  former_employee_gloss:
    tab: Classification
    order: 160
    spec: "textarea; conditional on former-employee in protected_classes"
  
  protected_class_details:
    tab: Classification
    order: 170
    spec: "textarea"
  
  excluded_classes:
    tab: Classification
    order: 180
    spec: "taxonomy: ws_excluded_class; multi-select; Sister to excluded_class_context; hook: required"
  
  excluded_class_context:
    tab: Classification
    order: 190
    spec: "textarea; conditional on excluded-class in legal_recognitions; hook: required"
  
  excluded_class_details:
    tab: Classification
    order: 200
    spec: "textarea"
  
  employment_sectors:
    tab: Classification
    order: 210
    spec: "taxonomy: ws_employment_sector; multi-select; hook: impacts"
  
  garcetti_exception_context:
    tab: Classification
    order: 220
    spec: "textarea; conditional on garcetti-exception in legal_recognitions AND public-sector in employment_sectors; hook: required"
  
  disclosure_targets:
    tab: Classification
    order: 230
    spec: "taxonomy: ws_disclosure_target; multi-select"
  
  disclosure_target_details:
    tab: Classification
    order: 240
    spec: "textarea"
  
  disclosure_channel_scope:
    tab: Classification
    order: 250
    spec: "select: any-channel|approved-channel-only|mandatory-internal-first|see-context; Sister to disclosure_channel_context; hook: required"
  
  disclosure_format:
    tab: Classification
    order: 260
    spec: "select: written-only|oral-permitted|either|has-details; Sister to disclosure_channel_context"
  
  disclosure_format_details:
    tab: Classification
    order: 270
    spec: "textarea"
  
  disclosure_channel_context:
    tab: Classification
    order: 280
    spec: "textarea; conditional on disclosure-channel-defined in legal_recognitions"
  
  ic_channel_sequence_gloss:
    tab: Classification
    order: 290
    spec: "textarea; conditional on has-ic-channel in protected_disclosures"

  # STATUTE OF LIMITATIONS & THRESHOLDS TAB
  sol_value:
    tab: "Statute of Limitations & Thresholds"
    order: 10
    spec: "number"
  
  sol_unit:
    tab: "Statute of Limitations & Thresholds"
    order: 20
    spec: "select: days|weeks|months|years"
  
  sol_triggers:
    tab: "Statute of Limitations & Thresholds"
    order: 30
    spec: "select: accrual|constructive-discharge-accrual|discovery-rule|filing-of-complaint|conclusion-of-admin-process|see-context; multi-select; hook: impacts,prerequisite"
  
  sol_trigger_discovery_gloss:
    tab: "Statute of Limitations & Thresholds"
    order: 40
    spec: "textarea; conditional on discovery-rule in sol_triggers"
  
  sol_trigger_gloss:
    tab: "Statute of Limitations & Thresholds"
    order: 50
    spec: "textarea; conditional on sol_triggers is non-empty"
  
  is_sol_suspended_during_admin:
    tab: "Statute of Limitations & Thresholds"
    order: 60
    spec: "boolean"
  
  has_sol_details:
    tab: "Statute of Limitations & Thresholds"
    order: 70
    spec: "boolean; approved use of *_details on trigger"
  
  sol_details:
    tab: "Statute of Limitations & Thresholds"
    order: 80
    spec: "textarea"

  # RETALIATION TAB (subset; full list continues pattern)
  adverse_action_scope:
    tab: Retaliation
    order: 10
    spec: "select: termination-only|material-adverse|broad-any-adverse-action|see-gloss; hook: excludes"
  
  adverse_action_scope_gloss:
    tab: Retaliation
    order: 15
    spec: "textarea; conditional on adverse_action_scope is non-empty; hook: override"
  
  adverse_actions:
    tab: Retaliation
    order: 20
    spec: "taxonomy: ws_adverse_action; multi-select; hook: impacts"

  # PROCESSES & REMEDIES TAB (subset)
  process_types:
    tab: "Processes & Remedies"
    order: 10
    spec: "taxonomy: ws_process_type; multi-select; hook: impacts,prerequisite"
  
  primary_agency:
    tab: "Processes & Remedies"
    order: 20
    spec: "select: post_type; hook: filter,derive"
  
  remedies:
    tab: "Processes & Remedies"
    order: 30
    spec: "taxonomy: ws_remedy; multi-select; hook: impacts,prerequisite"
  
  fee_shifting_standard:
    tab: "Processes & Remedies"
    order: 40
    spec: "select: bilateral-loser-pays|unilateral-pro-plaintiff|none-american-rule|prevailing-defendant-bad-faith|see-context; Sister to fee_shifting_standard_context; hook: required"
  
  fee_shifting_scope:
    tab: "Processes & Remedies"
    order: 50
    spec: "select: mandatory|discretionary|asymmetrical; Sister to fee_shifting_standard_context; hook: required"
  
  fee_shifting_standard_context:
    tab: "Processes & Remedies"
    order: 60
    spec: "textarea; conditional on fee-shifting-standard in legal_recognitions; hook: required"

  # BURDEN OF PROOF TAB (subset)
  burden_shifting_frameworks:
    tab: "Burden of Proof"
    order: 10
    spec: "select: mcdonnell-douglas|motivating-factor|but-for|mixed-motive|has-details; multi-select; Sister to burden_shifting_context; hook: required"
  
  employee_standard:
    tab: "Burden of Proof"
    order: 20
    spec: "taxonomy: ws_employee_standard; single-select"
  
  causation_standard:
    tab: "Burden of Proof"
    order: 30
    spec: "taxonomy: ws_causation_standard; single-select; Sister to causation_standard_context; hook: required"

  # REWARD TAB
  reward_discretion_scope:
    tab: Reward
    order: 10
    spec: "select: mandatory|discretionary|presumptive|formula-based|has-details; Sister to reward_context; hook: required"
  
  reward_context:
    tab: Reward
    order: 20
    spec: "textarea; conditional on reward-available in legal_recognitions"
  
  qui_tam_government_share:
    tab: Reward
    order: 30
    spec: "number; Sister to qui_tam_share_context"
  
  qui_tam_relator_share:
    tab: Reward
    order: 40
    spec: "number; Sister to qui_tam_share_context"
  
  qui_tam_share_context:
    tab: Reward
    order: 50
    spec: "textarea; conditional on qui-tam-action in legal_recognitions; hook: required"

  # WAIVER & SCOPE TAB (subset)
  civil_action_waiver_status:
    tab: "Waiver & Scope"
    order: 10
    spec: "select: prohibited|permitted-individual-only|permitted-collective|see-context; Sister to civil_action_waiver_context; hook: required,excluded-by"
  
  contractual_waiver_status:
    tab: "Waiver & Scope"
    order: 20
    spec: "select: void|limited|enforceable|void-public-policy|void-as-to-whistleblowing|enforceable-with-exceptions|see-context; Sister to contractual_waiver_context; hook: required,excluded-by"
  
  sovereign_immunity_status:
    tab: "Waiver & Scope"
    order: 30
    spec: "select: not-waived|partially-waived|fully-waived|has-details; Sister to sovereign_immunity_context; hook: required,excluded-by"
  
  anti_slapp_protection_scopes:
    tab: "Waiver & Scope"
    order: 40
    spec: "select: motion-to-strike|discovery-stay|fee-shift-on-motion|full-procedural-only|see-context; multi-select; Sister to anti_slapp_protection_context; hook: required"
  
  anti_slapp_protection_context:
    tab: "Waiver & Scope"
    order: 50
    spec: "textarea; conditional on anti-slapp-protection in legal_recognitions"

  # RELATIONSHIPS TAB
  ref_materials:
    tab: Relationships
    order: 10
    spec: "post_object: multi; multi-select"
  
  overruled_by_id:
    tab: Relationships
    order: 20
    spec: "post_object"

  # AUTHORITY TAB
  url:
    tab: Authority
    order: 10
    spec: "url"
  
  url_is_pdf:
    tab: Authority
    order: 20
    spec: "boolean"
  
  authority_reference:
    tab: Authority
    order: 30
    spec: "text"

  # HIDDEN FIELDS
  _disclosure_target_class:
    tab: Hidden
    order: 10
    spec: "select: internal|external|both; hook: derive"
  
  _primary_agency_is_fed:
    tab: Hidden
    order: 20
    spec: "boolean"
  
  _related_agencies:
    tab: Hidden
    order: 30
    spec: "post_object: multi"

---

# RECORD-TYPE DELTAS
# Which fields attach to which CPT; exclusions and per-type additions.

record_types:

  statute:
    label: "Statute"
    fields: all
    excludes: []
    additions: []
    notes: "Base record type. All common fields."

  common_law:
    label: "Common Law"
    fields: all
    excludes: []
    additions:
      - name: doctrine_basis
        tab: Classification
        order: 205
        spec: "textarea"
      - name: public_policy_sources
        tab: Classification
        order: 210
        spec: "select: constitution|federal-law|statute|administrative-rule|case-law|executive|has-details; multi-select"
      - name: policy_source_details
        tab: Classification
        order: 220
        spec: "textarea; conditional on has-details in public_policy_sources"
      - name: recognition_status
        tab: Classification
        order: 230
        spec: "select: recognized|limited|uncertain|rejected|abrogated|has-details"
      - name: recognition_status_details
        tab: Classification
        order: 240
        spec: "textarea; conditional on has-details in recognition_status"

  citation:
    label: "Citation / Case Law"
    fields: all
    excludes:
      - election_of_remedies_rules
      - doctrine_basis
      - public_policy_sources
      - recognition_status
    additions:
      - name: class
        tab: Identity
        order: 45
        spec: "select: case-law|statute|regulatory|secondary|has-details"
      - name: class_details
        tab: Identity
        order: 46
        spec: "textarea"
      - name: status
        tab: Identity
        order: 47
        spec: "select: published|unpublished|memorandum|vacated"
      - name: binding_strength
        tab: Identity
        order: 48
        spec: "select: binding|persuasive|mixed|distinguished|overruled"
      - name: court
        tab: Identity
        order: 49
        spec: "select: @matrix; hook: filter"
      - name: scope
        tab: Classification
        order: 12
        spec: "select: favorable|adverse|neutral|dual-effect; hook: verify"
      - name: extended_taxonomies
        tab: Classification
        order: 13
        spec: "repeater; conditional on scope is favorable OR scope is dual-effect; subfields: taxonomy(select from eligible_taxonomies), term(select; filtered by taxonomy)"
      - name: suppressed_taxonomies
        tab: Classification
        order: 14
        spec: "repeater; conditional on scope is adverse OR scope is dual-effect; subfields: taxonomy(select from eligible_taxonomies), term(select; filtered by taxonomy)"

  construction:
    label: "Construction"
    fields: all
    excludes:
      - election_of_remedies_rules
    additions:
      - name: is_en_banc
        tab: Identity
        order: 52
        spec: "boolean; default: true"
      - name: panel_composition_class
        tab: Identity
        order: 53
        spec: "select: three-judge|five-judge|seven-judge|nine-judge|expanded-panel|judge; conditional on is_en_banc is false"

---

metadata:
  version: "3.0"
  source: "legal-record-acf-fields-v3.0.md"
  guidance: "ws-acf-field-guidance-v1.0.md"
  format: "YAML (minimal field data)"
  notes: |
    This registry is FIELD DATA ONLY. It does not encode rules.
    Rules (naming, companions, sisters, conditionals, hooks, etc.) are defined
    in the global guidance document and are NOT repeated here.
    
    The compiler reads:
    1. ws-acf-field-guidance-v1.0.md (rules)
    2. fields-registry.yaml (field data)
    3. register-taxonomies.php (taxonomy terms)
    
    The spec field uses condensed notation that the compiler resolves
    against the guidance rules.
